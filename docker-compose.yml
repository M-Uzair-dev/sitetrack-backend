services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=1GB
      -c max_wal_size=2GB
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sitetrack:sitetrack@db:5432/sitetrack?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32chars}
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Bulk data loader (brief scale). Not started by `docker compose up`.
  # Run with: docker compose --profile seed run --rm seed
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sitetrack:sitetrack@db:5432/sitetrack?schema=public&connection_limit=1
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/seed/seed.js"]

volumes:
  pgdata:
